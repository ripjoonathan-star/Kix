name: Build Android APK

on:
  push:
    branches: "main"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies
        run: sudo apt-get update -y && sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev patch ccache

      - name: Install Buildozer
        run: pip install buildozer==1.5.0 "cython<3.0.0"

      - name: Check main.py
        run: ls -la Kix/main.py

      - name: Verify buildozer.spec
        run: |
          test -f buildozer.spec
          grep "source.dir" buildozer.spec
          grep "requirements" buildozer.spec

      - name: Build APK
        run: |
          yes | buildozer -v android debug > buildozer_build.log 2>&1
          if [ $? -ne 0 ]; then
            echo "=== Primeira tentativa falhou. Limpando venvs e tentando novamente ==="
            find .buildozer -type d -name venv -exec rm -rf {} + 2>/dev/null || true
            yes | buildozer -v android debug > buildozer_build.log 2>&1
          fi
          echo "=== Fim do log de build ==="
          tail -n 80 buildozer_build.log
          ls -la bin/
          test -f bin/*.apk

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer_build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
          if-no-files-found: error
