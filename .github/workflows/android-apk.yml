name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk-bundle /opt/ghc /usr/local/.ghcup /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - name: Cache Buildozer & Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
            ~/.gradle
          key: runner.os−buildozer−{{ runner.os }}-buildozer-runner.os−buildozer−{{ hashFiles('buildozer.spec') }}
          restore-keys: ${{ runner.os }}-buildozer-

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev patch ccache lld
          pip install --upgrade pip setuptools wheel
          pip install "buildozer==1.5.0" "cython<3.0.0" "kivy"

      - name: Prepare buildozer.spec
        run: |
          set -e
          MAIN_PY="$(find . -maxdepth 3 -name main.py -not -path './.git/*' -not -path './.buildozer/*' | head -n1 | sed 's|^\./||')"
          if [ -z "$MAIN_PY" ]; then
            echo "::error::Nenhum main.py encontrado no repositorio."
            exit 1
          fi
          APP_DIR="(dirname"(dirname "(dirname"MAIN_PY")"
          echo "Entry point: MAINPY(source.dir=MAIN_PY (source.dir =MAINP​Y(source.dir=APP_DIR)"
          [ -f buildozer.spec ] || buildozer init
          set_spec() {
            sed -i "s|^#\?1∗=.∗1 *=.*1∗=.∗|1=1 =1=2|" buildozer.spec
            grep -q "^1∗="buildozer.spec∣∣echo"1 *=" buildozer.spec || echo "1∗="buildozer.spec∣∣echo"1 = $2" >> buildozer.spec
          }
          set_spec "requirements" "python3==3.11.9,hostpython3==3.11.9,kivy,Pillow,cython"
          set_spec "log_level" "2"
          set_spec "p4a.branch" "master"
          set_spec "android.accept_sdk_license" "True"
          set_spec "source.dir" "$APP_DIR"
          echo "--- buildozer.spec configurado ---"
          grep -E "^(requirements|log_level|p4a.branch|android.accept_sdk_license|source.dir) *=" buildozer.spec

      - name: Build with Buildozer
        run: |
          set +e
          MAX_TRIES=2
          SUCCESS=0
          for i in (seq1(seq 1(seq1MAX_TRIES); do
            echo "=== Attempt iofi ofiofMAX_TRIES ==="
            (yes | buildozer -v android debug) > buildozer_build.log 2>&1
            if [ $? -eq 0 ]; then
              echo "Build succeeded."
              SUCCESS=1
              break
            fi
            echo "Build failed. Last 100 log lines:"
            tail -n 100 buildozer_build.log || true
            if [ "i"−lt"i" -lt "i"−lt"MAX_TRIES" ]; then
              echo "Cleaning p4a venvs and retrying..."
              find .buildozer -type d -name venv -path '*build*' -exec rm -rf {} + 2>/dev/null || true
              sleep 5
            fi
          done
          if [ "$SUCCESS" -ne 1 ]; then
            echo "::error::Build failed after $MAX_TRIES attempts."
            exit 1
          fi

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer_build.log
          if-no-files-found: ignore

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
          if-no-files-found: error
