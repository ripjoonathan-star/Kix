name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev patch
        pip install --upgrade pip
        pip install "buildozer==1.5.0" kivy cython

    - name: Build with Buildozer
      run: |
        # Se o arquivo buildozer.spec não existir, cria um básico automaticamente
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        
        # 1. SOLUÇÃO DEFINITIVA: Trava o Python interno do App e o Python do Servidor na mesma versão estável
        # Substitui a linha de requirements para injetar python3 e hostpython3 alinhados
        sed -i 's/requirements = python3==3.11.6,kivy==2.3.1,Pillow==10.4.0,cython==3.0.10/requirements = python3==3.11.9,hostpython3==3.11.9,kivy,Pillow,cython/g' buildozer.spec
        sed -i 's/requirements = python3,kivy/requirements = python3==3.11.9,hostpython3==3.11.9,kivy,Pillow,cython/g' buildozer.spec
        
        # 2. Configura log detalhado
        sed -i 's/log_level = 1/log_level = 2/g' buildozer.spec
        
        # 3. Limpa pastas residuais antigas que guardaram o Python 3.14 defeituoso
        buildozer android clean
        
        # 4. Executa a compilação
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
