name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Buildozer & Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
          ~/.gradle
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev libtinfo5 cmake libffi-dev libssl-dev patch ccache lld
        python3 -m pip install --upgrade pip setuptools wheel
        pip install "buildozer==1.5.0" "cython<3.0.0" kivy

    - name: Prepare buildozer.spec
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi

        python3 -c "
        import re

        with open('buildozer.spec', 'r') as f:
            content = f.read()

        def set_key(text, key, value):
            pattern = r'^\s*#?\s*' + re.escape(key) + r'\s*=.*$'
            replacement = f'{key} = {value}'
            if re.search(pattern, text, flags=re.MULTILINE):
                return re.sub(pattern, replacement, text, flags=re.MULTILINE)
            else:
                return text.rstrip() + f'\n{replacement}\n'

        content = set_key(content, 'requirements', 'python3==3.11.9,hostpython3==3.11.9,kivy,Pillow,cython')
        content = set_key(content, 'log_level', '2')
        content = set_key(content, 'p4a.branch', 'master')
        content = set_key(content, 'android.accept_sdk_license', 'True')

        with open('buildozer.spec', 'w') as f:
            f.write(content)
        "

    - name: Build with Buildozer
      run: |
        MAX_TRIES=2
        for i in $(seq 1 $MAX_TRIES); do
          echo "=== Tentativa $i de $MAX_TRIES ==="
          if yes | buildozer -v android debug; then
            echo "Build concluído com sucesso."
            exit 0
          fi

          echo "Build falhou na tentativa $i."
          if [ "$i" -lt "$MAX_TRIES" ]; then
            echo "Limpando venvs temporárias do p4a e tentando novamente..."
            find .buildozer -type d -name venv -path '*build*' -exec rm -rf {} + 2>/dev/null || true
            sleep 5
          fi
        done

        echo "Build falhou após $MAX_TRIES tentativas."
        exit 1

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
