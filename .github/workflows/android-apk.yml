name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev patch
        pip install --upgrade pip
        pip install "buildozer==1.5.0" "cython<3.0.0" kivy

    - name: Build with Buildozer
      run: |
        # Força a limpeza de qualquer cache antigo da pasta do projeto para eliminar o Python 3.14 residual
        rm -rf .buildozer
        rm -rf ~/.buildozer
        
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        
        # Injeta obrigatoriamente a correção de versões no arquivo de configuração
        python3 -c "
        with open('buildozer.spec', 'r') as f:
            lines = f.readlines()
        with open('buildozer.spec', 'w') as f:
            for line in lines:
                if line.strip().startswith('requirements ='):
                    f.write('requirements = python3==3.11.9,hostpython3==3.11.9,kivy,Pillow,cython\n')
                elif line.strip().startswith('log_level ='):
                    f.write('log_level = 2\n')
                else:
                    f.write(line)
        "
        
        # Executa a compilação limpa respondendo sim para as licenças
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
