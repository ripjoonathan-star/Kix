name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install "buildozer==1.5.0" kivy cython

    - name: Build with Buildozer
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        
        # Garante sintaxe genérica do Python
        sed -i 's/requirements = python3==3.11.6/requirements = python3/g' buildozer.spec
        
        # FORÇA LOG MÁXIMO: Altera o log_level para 2 dentro do buildozer.spec para capturar o erro exato
        sed -i 's/log_level = 1/log_level = 2/g' buildozer.spec
        
        # Executa o buildozer
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
