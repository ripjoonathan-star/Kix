name: Build Android APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev patch
        pip install --upgrade pip
        pip install "buildozer==1.5.0" kivy cython

    - name: Build with Buildozer
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
        fi
        
        # 1. Alinha a versão do Python removendo restrições rígidas
        sed -i 's/requirements = python3==3.11.6/requirements = python3/g' buildozer.spec
        
        # 2. CORREÇÃO DO PILLOW: Remove as tags de versão estrita (==10.4.0 e ==2.3.1) do spec
        # Isso permite que o Buildozer escolha as versões nativamente compatíveis com os patches do Android
        sed -i 's/Pillow==10.4.0/Pillow/g' buildozer.spec
        sed -i 's/kivy==2.3.1/kivy/g' buildozer.spec
        
        # Mantém o log detalhado para auditoria
        sed -i 's/log_level = 1/log_level = 2/g' buildozer.spec
        
        # Executa o buildozer aprovando os termos
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: package
        path: bin/*.apk
